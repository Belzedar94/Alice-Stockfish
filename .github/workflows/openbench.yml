name: OpenBench

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.simd }} ${{ matrix.bitops }} private artifacts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64-bmi2
            simd: avx2
            bitops: pext
          - arch: x86-64-avx2
            simd: avx2
            bitops: popcnt
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Fetch the pinned run2rl network
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import urllib.request

          url = "https://github.com/Belzedar94/Alice-Stockfish/releases/download/openbench-assets-v1/alice_run2rl_e40_l09.nnue"
          expected = "9f9e557015a55c0a6981db64e1f3044dedb91fd8a8c1a6d4f3c45d0eee91fbd9"
          payload = urllib.request.urlopen(url, timeout=120).read()
          assert hashlib.sha256(payload).hexdigest() == expected
          Path("networks").mkdir()
          Path("networks/alice_run2rl_e40_l09.nnue").write_bytes(payload)
          PY
      - name: Build and verify Alice-Stockfish
        run: |
          python3 tests/alice/test_openbench_build_contract.py
          python3 tests/alice/test_v2_run_config.py
          python3 tests/alice/test_v2_chunk_run_binding.py
          python3 tests/alice/test_v2_corpus_contract.py
          python3 -m py_compile tools/alice_v2_chunk.py tools/alice_v2_corpus.py tools/alice_v2_run_config.py
          make -j2 -C src ARCH=${{ matrix.arch }} EXTRALDFLAGS=-static build
          make -j2 -C src ARCH=${{ matrix.arch }} EXTRALDFLAGS=-static GIT_SHA_FULL=${{ github.sha }} GIT_DIFFINDEX= data-generator
          python3 tests/alice/test_reference.py
          python3 tests/alice/test_engine.py --engine src/stockfish
          make -C src ARCH=${{ matrix.arch }} GIT_SHA_FULL=${{ github.sha }} GIT_DIFFINDEX= PYTHON=python3 alice-data-generator-tests
          file src/stockfish | grep 'statically linked'
          file src/alice-stockfish-data-generator | grep 'statically linked'
      - name: Stage role-specific executables
        run: |
          mkdir artifact-play artifact-datagen
          install -m 0755 src/stockfish artifact-play/alice-stockfish
          install -m 0755 src/alice-stockfish-data-generator artifact-datagen/alice-stockfish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alice-stockfish-linux-${{ matrix.simd }}-${{ matrix.bitops }}-play
          path: artifact-play/alice-stockfish
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alice-stockfish-linux-${{ matrix.simd }}-${{ matrix.bitops }}-datagen
          path: artifact-datagen/alice-stockfish
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.simd }} ${{ matrix.bitops }} private artifacts
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64-bmi2
            simd: avx2
            bitops: pext
          - arch: x86-64-avx2
            simd: avx2
            bitops: popcnt
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
      - name: Fetch the pinned run2rl network
        shell: msys2 {0}
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import urllib.request

          url = "https://github.com/Belzedar94/Alice-Stockfish/releases/download/openbench-assets-v1/alice_run2rl_e40_l09.nnue"
          expected = "9f9e557015a55c0a6981db64e1f3044dedb91fd8a8c1a6d4f3c45d0eee91fbd9"
          payload = urllib.request.urlopen(url, timeout=120).read()
          assert hashlib.sha256(payload).hexdigest() == expected
          Path("networks").mkdir()
          Path("networks/alice_run2rl_e40_l09.nnue").write_bytes(payload)
          PY
      - name: Build and verify Alice-Stockfish
        shell: msys2 {0}
        run: |
          python tests/alice/test_openbench_build_contract.py
          python tests/alice/test_v2_run_config.py
          python tests/alice/test_v2_chunk_run_binding.py
          python tests/alice/test_v2_corpus_contract.py
          python -m py_compile tools/alice_v2_chunk.py tools/alice_v2_corpus.py tools/alice_v2_run_config.py
          make -j2 -C src ARCH=${{ matrix.arch }} build
          make -j2 -C src ARCH=${{ matrix.arch }} GIT_SHA_FULL=${{ github.sha }} GIT_DIFFINDEX= data-generator
          python tests/alice/test_reference.py
          python tests/alice/test_engine.py --engine src/stockfish.exe
          make -C src ARCH=${{ matrix.arch }} GIT_SHA_FULL=${{ github.sha }} GIT_DIFFINDEX= PYTHON=python alice-data-generator-tests
      - name: Stage role-specific executables
        shell: msys2 {0}
        run: |
          mkdir artifact-play artifact-datagen
          install -m 0755 src/stockfish.exe artifact-play/alice-stockfish.exe
          install -m 0755 src/alice-stockfish-data-generator.exe artifact-datagen/alice-stockfish.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alice-stockfish-windows-${{ matrix.simd }}-${{ matrix.bitops }}-play
          path: artifact-play/alice-stockfish.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alice-stockfish-windows-${{ matrix.simd }}-${{ matrix.bitops }}-datagen
          path: artifact-datagen/alice-stockfish.exe
          if-no-files-found: error
